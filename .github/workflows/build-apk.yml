name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔨 Build web assets
        run: npm run build

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: 34
          build-tools-version: '34.0.0'

      - name: ➕ Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 📋 Copy native plugin files into Android project
        run: |
          BASE=android/app/src/main/java/cn/selfdiscipline/app
          mkdir -p "$BASE/plugin"
          cp android_plugin/java/cn/selfdiscipline/app/MainActivity.kt "$BASE/"
          cp android_plugin/java/cn/selfdiscipline/app/plugin/*.kt "$BASE/plugin/"
          echo "=== plugin files ==="
          ls -la "$BASE" "$BASE/plugin"

      - name: 📝 Overwrite AndroidManifest with full declarations
        run: cp android_plugin/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: 🎨 Copy resource files (styles, strings)
        run: |
          RES_DIR=android/app/src/main/res/values
          mkdir -p "$RES_DIR"
          cp android_plugin/res/values/styles.xml "$RES_DIR/styles.xml"
          cp android_plugin/res/values/strings.xml "$RES_DIR/strings.xml"
          echo "=== res/values ==="
          ls -la "$RES_DIR"

      - name: 🔧 Ensure AppCompat dependency in build.gradle
        run: |
          GRADLE_FILE=android/app/build.gradle
          if ! grep -q "androidx.appcompat:appcompat" "$GRADLE_FILE"; then
            sed -i '/dependencies {/a \    implementation "androidx.appcompat:appcompat:1.6.1"' "$GRADLE_FILE"
            echo "Added AppCompat dependency"
          fi
          echo "=== build.gradle dependencies ==="
          grep -A 30 "dependencies {" "$GRADLE_FILE" | head -35

      - name: 🔨 Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lint --stacktrace

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-discipline-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📦 Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          draft: false
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Print build output info
        if: always()
        run: |
          echo "=== APK output dir ==="
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "(none)"
